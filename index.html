<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product and price crud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body style="background-color: #ededed;">
   <div class="container">
    <div class="row">
        <div class="col-6 mt-5">
               <h2 class="text-center bg-warning" id="h1">Add Product !!</h2>
               <h2 class="text-center d-none bg-warning" id="h2">update product !!</h2>
             <div class="card">
                <div class="card-body">
                 
                    <form action="" id="form" class="form-group">
                        <div>
                            <label for="product">product Name:-</label>
                            <input type="text" class="form-control" id="product" placeholder="enter product">
                        </div>
                          <div>
                            <label for="price">price:-</label>
                            <input type="number" class="form-control" id="price" placeholder="enter price">
                        </div>
                        <br>
                        <button class="btn btn-primary btn-sm btn-block" id="submit">submit</button>
                        <button  type="button" class="btn btn-primary btn-sm btn-block d-none" id="update">update</button>
                    </form>
                </div>
             </div>
        </div>
        <div class="col-6 mt-5">
            <div class="card">
                <div class="card-body">
                    <table class="table table-resposive table-warning table-striped">
                        <thead>
                              <tr>
                                <th>Sr.no</th>
                                <th>product name</th>
                                <th>price</th>
                                <th>Edit</th>
                                <th>Delete</th>
                              </tr>
                        </thead>
                        <tbody id="info">
                            <!-- <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><i class="fa-solid fa-pen fa-2x text-primary"  role="button"></i></td>
                                <td><i class="fa-solid fa-trash-can fa-2x text-danger" role="button"></i></td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
   </div>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
